<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Ambient Dual-Lobe Glow -->
    <radialGradient id="fav-glow-left" cx="32%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff1a40" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#a80924" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fav-glow-right" cx="68%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ff3355" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#80061b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Main Lemniscate Red-to-Black Gradient -->
    <linearGradient id="fav-infinity-grad" x1="5%" y1="15%" x2="95%" y2="85%">
      <stop offset="0%" stop-color="#ff4567" />
      <stop offset="22%" stop-color="#ff1a40" />
      <stop offset="48%" stop-color="#d90d34" />
      <stop offset="72%" stop-color="#700618" />
      <stop offset="90%" stop-color="#280309" />
      <stop offset="100%" stop-color="#0d0204" />
    </linearGradient>

    <!-- Front Overlap Strand Gradient -->
    <linearGradient id="fav-crossover-grad" x1="25%" y1="75%" x2="75%" y2="25%">
      <stop offset="0%" stop-color="#b80c2b" />
      <stop offset="35%" stop-color="#ff1a40" />
      <stop offset="65%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#ff264c" />
    </linearGradient>

    <!-- Glossy Specular Sheen Gradient -->
    <linearGradient id="fav-specular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ff94a8" stop-opacity="0.6" />
      <stop offset="55%" stop-color="#ff1a40" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff1a40" stop-opacity="0" />
    </linearGradient>

    <!-- Rim Stroke Gradient for Crisp Definition -->
    <linearGradient id="fav-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff738e" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff1a40" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#990b20" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff2a50" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Behind Lobes -->
  <circle cx="32" cy="50" r="30" fill="url(#fav-glow-left)" />
  <circle cx="68" cy="50" r="30" fill="url(#fav-glow-right)" />

  <!-- Base Lemniscate Shadow / Depth Layer -->
  <path
    d="M 50 50 C 35 22 12 22 12 50 C 12 78 35 78 50 50 C 65 22 88 22 88 50 C 88 78 65 78 50 50 Z"
    stroke="#000000"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- Main Lemniscate Loop Body (Red-Black Gradient) -->
  <path
    d="M 50 50 C 35 22 12 22 12 50 C 12 78 35 78 50 50 C 65 22 88 22 88 50 C 88 78 65 78 50 50 Z"
    stroke="url(#fav-infinity-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crisp Rim Accent Line -->
  <path
    d="M 50 50 C 35 22 12 22 12 50 C 12 78 35 78 50 50 C 65 22 88 22 88 50 C 88 78 65 78 50 50 Z"
    stroke="url(#fav-rim-grad)"
    stroke-width="1"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 3D Crossover Drop Shadow (Under front strand) -->
  <path
    d="M 37 63 C 43 57 50 50 57 43 C 61 39 63 37 63 37"
    stroke="#000000"
    stroke-width="16"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- 3D Crossover Front Strand (Weaving Over) -->
  <path
    d="M 33 67 C 42 58 50 50 58 42 C 62 38 67 33 67 33"
    stroke="url(#fav-crossover-grad)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Crossover Rim Accent -->
  <path
    d="M 33 67 C 42 58 50 50 58 42 C 62 38 67 33 67 33"
    stroke="#ff8099"
    stroke-width="0.8"
    stroke-linecap="round"
    stroke-opacity="0.6"
  />

  <!-- Specular Gloss Sheen on Left Lobe Top Arc -->
  <path
    d="M 44 42 C 36 27 18 27 14 46"
    stroke="url(#fav-specular)"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Specular Gloss Sheen on Right Lobe Top Arc -->
  <path
    d="M 56 42 C 64 27 82 27 86 46"
    stroke="url(#fav-specular)"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Central Luminous AI Energy Spark -->
  <circle cx="50" cy="50" r="4.5" fill="#ff1a40" opacity="0.6" />
  <circle cx="50" cy="50" r="2.2" fill="#ffffff" opacity="0.95" />

  <!-- Cosmic Micro Sparkles -->
  <circle cx="80" cy="20" r="1.8" fill="#ff4d6d" opacity="0.85" />
  <circle cx="80" cy="20" r="0.8" fill="#ffffff" />
  <circle cx="20" cy="80" r="1.5" fill="#ff264c" opacity="0.75" />
</svg>
